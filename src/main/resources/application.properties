spring.application.name=domain

# 파일 모드라 앱을 내려도 데이터가 남는다. AUTO_SERVER=TRUE 는 앱이 떠 있는 동안에도
# IntelliJ 같은 외부 도구로 같은 파일에 붙을 수 있게 해 준다(없으면 "Database may be already in use" 가 난다).
# 기존 ./data/domain.mv.db는 구 모델 보존본이다. 이 모델은 별도 빈 DB에서 시작한다.
spring.datasource.url=jdbc:h2:file:./data/domain-construction-rental-v2;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# 엔티티를 고치면 컬럼을 더해 준다. 단, 컬럼 삭제나 타입 변경은 못 하니 그럴 땐 data/ 를 지우고 다시 받는다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# data.go.kr 인증키는 포털의 Encoding·Decoding 값 모두 받을 수 있습니다.
domain.ingest.service-key=${DATA_GO_KR_SERVICE_KEY:}

# 15057999 LH 분양임대공고별 상세정보
domain.ingest.base-url.lh=https://apis.data.go.kr/B552555
# 15108420 마이홈 공공주택 모집공고 (rsdtRcritNtcList / ltRsdtRcritNtcList)
domain.ingest.base-url.myhome-notice=https://apis.data.go.kr/1613000/HWSPR02
# 15110581 마이홈 공공임대주택 단지정보 (rentalHouseGwList)
domain.ingest.base-url.myhome-complex=https://apis.data.go.kr/1613000/HWSPR04
